[package]
name = "whale-signer"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "=0.23.1"
bs58 = "=0.5.1"
chacha20poly1305 = "=0.11.0"
curve25519-dalek = "=5.0.0"
ed25519-dalek = "=3.0.0"
getrandom = "=0.4.3"
hex = "=0.4.3"
k256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "std"] }
scrypt = "=0.12.0"
serde_json = "=1.0.154"
sha2 = "=0.11.1"
sha3 = "=0.12.0"
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
zeroize = "=1.9.1"

[profile.release]
overflow-checks = true
